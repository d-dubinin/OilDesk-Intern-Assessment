[project]
name = "oildesk-intern-assessment"
version = "0.1.0"
description = "Oil Desk commodity data pipeline and analytics dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "uvicorn[standard]>=0.49.0",
]

[tool.uv]
dev-dependencies = [
    "httpx2>=0.28.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/async_pipeline.py"]

[tool.coverage.report]
show_missing = true
